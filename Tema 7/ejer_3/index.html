
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mi tienda online</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <header id="encabezado">
        <h1>Mi tienda online</h1>
    </header>

    <p class="oferta">
        ¡Oferta especial! 20% de descuento en productos seleccionados.
    </p>

    <section class="productos">

        <div class="tarjeta">
            <h2>Producto 1</h2>
            <p>Precio: 20 €</p>
            <button class="boton">Comprar</button>
        </div>

        <div class="tarjeta tarjeta-destacada">
            <h2>Producto 2</h2>
            <p>Precio: 35 €</p>
            <button class="boton">Comprar</button>
        </div>

        <div class="tarjeta">
            <h2>Producto 3</h2>
            <p>Precio: 15 €</p>
            <button class="boton">Comprar</button>
        </div>

    </section>

</body>
</html>
