
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Página de ancho fijo</title>
</head>

<body style="margin: 0;">

    <div style="
        width: 800px;
        margin: 0 auto;
        background-color: #e6e6e6;
        padding: 20px;
        box-sizing: border-box;
    ">

        <h1>Mi página web</h1>

        <p>
            Esta página tiene un ancho fijo de 800 píxeles
            y está centrada horizontalmente en el navegador.
        </p>

        <h2>Contenido principal</h2>

        <p>
            Independientemente del tamaño de la ventana
            del navegador, el ancho de esta página será
            siempre de 800 píxeles.
        </p>

    </div>

</body>
</html>
